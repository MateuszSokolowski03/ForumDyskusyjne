<!DOCTYPE html>
<html class="dark" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widok Wątku - Forum Dyskusyjne</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-50 bg-white/95 dark:bg-[#111722]/95 backdrop-blur-sm border-b border-gray-200 dark:border-[#232f48]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center gap-4">
                        <div id="logo-container" class="flex items-center gap-3">
                            <div class="text-primary">
                                <span class="material-symbols-outlined text-2xl">forum</span>
                            </div>
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Forum Dyskusyjne</h1>
                        </div>
                    </div>

                    <nav class="hidden md:flex items-center gap-6">
                        <a href="/" class="nav-item">🏠</a>
                        <a href="forum.html" class="nav-item nav-item--active">📂</a>
                        <a href="messages.html" class="nav-item">💬</a>
                        <button id="search-toggle" class="nav-item">🔍</button>
                    </nav>

                    <div class="flex items-center gap-4">
                        <div id="search-container" class="hidden items-center relative">
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm">search</span>
                                <input id="search-input" type="text" placeholder="Szukaj..." class="w-40 md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-primary">
                                <button id="search-close" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"><span class="material-symbols-outlined text-sm">close</span></button>
                            </div>
                        </div>
                        <div id="auth-container" class="relative"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <div class="mb-6 flex items-center gap-2 text-sm">
                    <a href="forum.html" class="text-primary hover:underline">Kategorie</a>
                    <span class="text-gray-400">/</span>
                    <a id="forum-breadcrumb" href="#" class="text-primary hover:underline">Forum</a>
                    <span class="text-gray-400">/</span>
                    <span id="thread-breadcrumb" class="text-gray-600 dark:text-gray-400">Wątek</span>
                </div>

                <div class="mb-8">
                    <h1 id="thread-title" class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Ładowanie wątku...</h1>
                    <div class="flex flex-wrap items-center gap-4 text-sm text-gray-600 dark:text-gray-400">
                        <span>Autor: <span id="thread-author" class="font-medium"></span></span>
                        <span>Utworzono: <span id="thread-date" class="font-medium"></span></span>
                        <span>Wyświetleń: <span id="thread-views" class="font-medium">0</span></span>
                        <span>Odpowiedzi: <span id="thread-replies" class="font-medium">0</span></span>
                    </div>
                </div>

                <div id="loading" class="text-center py-8">
                    <p class="text-gray-600 dark:text-gray-400">⏳ Ładowanie wątku...</p>
                </div>

                <div id="content" class="hidden space-y-6 mb-8"></div>

                <div id="error" class="hidden text-center py-8">
                    <p class="text-red-600 dark:text-red-400">❌ Błąd ładowania wątku</p>
                    <a href="forum.html" class="text-primary hover:underline mt-4 inline-block">← Powrót do kategorii</a>
                </div>

                <div id="reply-section" class="hidden mt-8">
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Dodaj odpowiedź</h2>
                    <form id="reply-form" class="bg-white dark:bg-[#192231] p-6 rounded-lg border border-gray-200 dark:border-gray-700">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Treść</label>
                            <textarea id="reply-content" placeholder="Wpisz swoją odpowiedź..." rows="6" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:ring-2 focus:ring-primary"></textarea>
                        </div>
                        <button type="submit" class="bg-primary hover:bg-primary/90 text-white font-bold py-2 px-4 rounded-lg">Wyślij odpowiedź</button>
                    </form>
                </div>
            </div>
        </main>

        <footer class="mt-auto border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-[#192231]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <p class="text-sm text-center text-gray-500">© 2024 Forum Dyskusyjne.</p>
            </div>
        </footer>
    </div>

    <script src="js/main.js"></script>
    <script>
        let currentUser = null;
        let currentThreadId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            // main.js automatycznie obsłuży logowanie UI (setupAuthenticationUI)
            
            const params = new URLSearchParams(window.location.search);
            currentThreadId = params.get('threadId');

            if (!currentThreadId) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                return;
            }

            // Pobierz dane użytkownika
            try {
                const statusResponse = await fetch('/api/auth/status', { credentials: 'include' });
                if (statusResponse.ok) {
                    const userData = await statusResponse.json();
                    // Normalizacja danych użytkownika (obsługa zagnieżdżenia user.user lub płaskiej struktury)
                    if (userData.user) {
                        currentUser = { ...userData.user, role: userData.role || userData.user.role, moderatedForumIds: userData.moderatedForumIds };
                    } else {
                        currentUser = userData;
                    }
                    console.log('✅ Zalogowany jako:', currentUser.username, 'Rola:', currentUser.role);
                    document.getElementById('reply-section').classList.remove('hidden');
                }
            } catch (e) {
                console.log('ℹ️ Użytkownik niezalogowany');
            }

            await loadThread(parseInt(currentThreadId, 10));

            // Obsługa Edycji/Usuwania (Delegacja zdarzeń)
            document.getElementById('content').addEventListener('click', handleMessageActions);
            
            // Obsługa wysyłania odpowiedzi
            document.getElementById('reply-form')?.addEventListener('submit', handleReplySubmit);
        });

        async function loadThread(threadId) {
            try {
                const response = await fetch(`/api/forum/thread/${threadId}`, { credentials: 'include' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                renderThread(data);
            } catch (error) {
                console.error('❌ Błąd ładowania:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderThread(data) {
            // Obsługa różnej wielkości liter (CamelCase z API vs PascalCase z C#)
            const thread = data.thread || data.Thread;
            const messages = data.messages || data.Messages || [];
            
            if (!thread) return;

            // Ustawianie nagłówka
            document.getElementById('thread-title').textContent = escapeHtml(thread.title || '');
            const authorName = thread.author?.username || thread.authorName || 'Anonim';
            document.getElementById('thread-author').textContent = escapeHtml(authorName);
            
            // --- POPRAWKA: Użycie toLocaleString zamiast toLocaleDateString ---
            document.getElementById('thread-date').textContent = new Date(thread.createdAt).toLocaleString('pl-PL', { dateStyle: 'long', timeStyle: 'short' });
            // -------------------------------------------------------------------

            document.getElementById('thread-views').textContent = thread.views || 0;
            document.getElementById('thread-replies').textContent = Math.max(0, messages.length - 1);

            // Breadcrumbs
            const forumId = thread.forum?.id || thread.forumId;
            const forumName = thread.forum?.name || thread.forumName;
            const forumCrumb = document.getElementById('forum-breadcrumb');
            if (forumId && forumCrumb) {
                forumCrumb.href = `forum.html?forumId=${forumId}`;
                forumCrumb.textContent = escapeHtml(forumName || 'Forum');
            }

            // Renderowanie wiadomości
            const content = document.getElementById('content');
            if (messages.length === 0) {
                content.innerHTML = '<p class="text-center text-gray-500">Brak wiadomości.</p>';
                return;
            }

            content.innerHTML = messages.map((msg, index) => {
                const isOP = index === 0;
                const author = msg.author || {};
                const avatarUrl = author.avatarUrl || null;
                const username = author.username || 'Anonim';
                
                // --- POPRAWKA: Użycie toLocaleString zamiast toLocaleDateString ---
                const date = new Date(msg.createdAt).toLocaleString('pl-PL', { dateStyle: 'long', timeStyle: 'short' });
                // -------------------------------------------------------------------
                
                return `
                <article class="p-6 rounded-lg border ${isOP ? 'border-blue-200 bg-blue-50/50 dark:bg-blue-900/10 dark:border-blue-800' : 'border-gray-200 bg-white dark:bg-[#192231] dark:border-gray-700'}" id="msg-${msg.id}">
                    <div class="flex gap-4">
                        <div class="flex-shrink-0">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-gray-600 dark:text-gray-300 overflow-hidden bg-gray-200 dark:bg-gray-700" 
                                 style="${avatarUrl ? `background-image:url('${avatarUrl}');background-size:cover;` : ''}">
                                ${!avatarUrl ? username.charAt(0).toUpperCase() : ''}
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-2">
                                <div>
                                    <span class="font-bold text-gray-900 dark:text-white mr-2">${escapeHtml(username)}</span>
                                    <span class="text-xs text-gray-500 dark:text-gray-400">${date}</span>
                                </div>
                                ${isOP ? '<span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded dark:bg-blue-900 dark:text-blue-200">OP</span>' : ''}
                            </div>
                            
                            <div class="prose prose-sm dark:prose-invert max-w-none text-gray-800 dark:text-gray-200 break-words message-content">
                                ${escapeHtml(msg.content)}
                            </div>
                            
                            ${msg.updatedAt || msg.isEdited ? '<p class="text-xs text-gray-400 mt-2 italic">Edytowano</p>' : ''}
                            
                            ${renderModeratorButtons(currentUser, msg, thread)}
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

function renderModeratorButtons(user, msg, thread) {
    if (!user) return '';

    // Konwersja ID na liczby dla pewności
    const currentUserId = parseInt(user.id || user.userId);
    const msgAuthorId = parseInt(msg.author?.id || msg.authorId);
    const forumId = parseInt(thread.forum?.id || thread.forumId);

    // 1. Sprawdź czy to Autor
    const isAuthor = currentUserId === msgAuthorId;

    // 2. Sprawdź czy to Admin (bezpieczne sprawdzanie stringa)
    const userRole = String(user.role || '').toLowerCase();
    const isAdmin = userRole === 'admin';

    // 3. Sprawdź czy to Moderator tego forum
    let isMod = false;
    if (userRole === 'moderator' && Array.isArray(user.moderatedForumIds)) {
        const modIds = user.moderatedForumIds.map(Number);
        if (modIds.includes(forumId)) {
            isMod = true;
        }
    }

    // Debugowanie w konsoli (jeśli przyciski się nie pojawiają, sprawdź F12)
    // console.log(`Msg ${msg.id}: Author=${isAuthor}, Admin=${isAdmin}, Mod=${isMod} (UserRole=${userRole})`);

    if (isAuthor || isAdmin || isMod) {
        return `
        <div class="mt-4 flex gap-2 border-t border-gray-100 dark:border-gray-700 pt-2">
            <button class="edit-btn text-xs font-semibold text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300" 
                    data-id="${msg.id}">Edytuj</button>
            <button class="delete-btn text-xs font-semibold text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300" 
                    data-id="${msg.id}">Usuń</button>
        </div>`;
    }
    return '';
}

        async function handleMessageActions(e) {
            const btn = e.target;
            const msgId = btn.dataset.id;
            
            // EDYCJA
            if (btn.classList.contains('edit-btn')) {
                const article = document.getElementById(`msg-${msgId}`);
                const contentDiv = article.querySelector('.message-content');
                const oldContent = contentDiv.textContent.trim();
                
                const newContent = prompt("Edytuj treść:", oldContent);
                if (newContent !== null && newContent !== oldContent) {
                    try {
                        const res = await fetch(`/api/forum/messages/${msgId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ content: newContent })
                        });
                        
                        if (res.ok) {
                            location.reload();
                        } else {
                            const err = await res.json();
                            alert('Błąd: ' + (err.error || 'Nie udało się edytować'));
                        }
                    } catch (error) {
                        alert('Błąd połączenia');
                    }
                }
            }

            // USUWANIE
            if (btn.classList.contains('delete-btn')) {
                if (!confirm("Czy na pewno usunąć tę wiadomość?")) return;
                
                try {
                    // Przekazanie userId w URL (zgodnie z kontrolerem)
                    const userId = currentUser ? currentUser.id : 0;
                    
                    const res = await fetch(`/api/forum/messages/${msgId}?userId=${userId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data.isThreadDeleted) {
                            alert('Usunięto pierwszą wiadomość - cały wątek został usunięty.');
                            window.location.href = 'forum.html';
                        } else {
                            location.reload();
                        }
                    } else {
                        const err = await res.json();
                        alert('Błąd: ' + (err.error || 'Nie udało się usunąć'));
                    }
                } catch (error) {
                    alert('Błąd połączenia');
                }
            }
        }

        async function handleReplySubmit(e) {
            e.preventDefault();
            if (!currentUser) return alert('Musisz być zalogowany');
            
            const content = document.getElementById('reply-content').value.trim();
            if (!content) return alert('Wpisz treść');

            try {
                const res = await fetch('/api/forum/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ threadId: parseInt(currentThreadId), content })
                });

                if (res.ok) {
                    location.reload();
                } else {
                    const err = await res.json();
                    alert('Błąd: ' + (err.error || 'Nie udało się dodać odpowiedzi'));
                }
            } catch (e) {
                alert('Błąd połączenia');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html class="dark" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Dyskusyjne - Kategorie</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Tailwind Config -->
    <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation Bar -->
        <header class="sticky top-0 z-50 bg-white/95 dark:bg-[#111722]/95 backdrop-blur-sm border-b border-gray-200 dark:border-[#232f48]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <!-- Logo and Brand -->
                    <div class="flex items-center gap-4">
                        <div id="logo-container" class="flex items-center gap-3">
                            <div class="text-primary flex items-center">
                                <span class="material-symbols-outlined text-2xl hidden sm:inline">forum</span>
                            </div>
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white">
                                Forum Dyskusyjne
                            </h1>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <nav class="hidden md:flex items-center gap-6">
                        <a href="/" class="nav-item" title="Strona główna">
                            🏠
                        </a>
                        <a href="forum.html" class="nav-item nav-item--active" title="Kategorie">
                            📂
                        </a>
                        <a href="messages.html" class="nav-item" title="Wiadomości">
                            💬
                        </a>
                        <button id="search-toggle" class="nav-item" title="Szukaj">
                            🔍
                        </button>
                    </nav>

                    <!-- Search and User Actions -->
                    <div class="flex items-center gap-4">
                        <!-- Expandable Search Bar -->
                        <div id="search-container" class="hidden items-center relative">
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 text-sm">
                                    search
                                </span>
                                <input 
                                    id="search-input"
                                    type="text" 
                                    placeholder="Szukaj..." 
                                    class="w-40 md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                                >
                                <button id="search-close" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300">
                                    <span class="material-symbols-outlined text-sm">close</span>
                                </button>
                            </div>
                        </div>

                        <!-- Auth Container - Avatar lub Login/Register -->
                        <div id="auth-container" class="relative">
                            <!-- Dynamicznie wstawiane przez JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Kategorie Forum</h1>
                    <button id="new-thread-btn-top" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                        <span class="material-symbols-outlined align-middle">add_circle</span>
                        Nowy wątek
                    </button>
                </div>
                <div id="loading" class="text-center py-8">
                    
                    <p class="text-gray-600 dark:text-gray-400">⏳ Ładowanie forum...</p>
                </div>
                <div id="content" class="hidden">
                    <!-- Dynamicznie ładowane zawartości -->
                </div>
                <div id="error" class="hidden text-center py-8">
                    <p class="text-red-600 dark:text-red-400">❌ Błąd ładowania forum</p>
                </div>
            </div>
        </main>

        <!-- Modal do tworzenia nowego wątku -->
        <div id="new-thread-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-[#192231] rounded-xl shadow-lg max-w-2xl w-full border border-gray-200 dark:border-gray-700">
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 dark:text-white">Nowy Wątek</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">⚠️ Wątek nie może zawierać zakazanych słów</p>
                        </div>
                    <button id="close-modal" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Forum</label>
                        <label for="thread-forum" class="block mb-1 text-gray-700 dark:text-gray-300">
                                Wybierz forum:
                            </label>

                            <select id="thread-forum"
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2">
                                <option value="">Wybierz forum...</option>
                            </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Tytuł Wątku</label>
                        <input id="thread-title" type="text" placeholder="Wpisz tytuł wątku..." class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Treść</label>
                        <textarea id="thread-content" placeholder="Opisz swoją wiadomość..." rows="6" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200 dark:border-gray-700">
                    <button id="cancel-modal" class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#232f48] transition-colors">
                        Anuluj
                    </button>
                    <button id="create-thread-btn" class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-primary/90 transition-colors font-medium">
                        Utwórz Wątek
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-auto border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-[#192231]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <p class="text-sm text-gray-500 dark:text-gray-400">© 2024 Forum Dyskusyjne. Wszelkie prawa zastrzeżone.</p>
                    <div class="flex gap-6 text-sm">
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="rules.html">Regulamin</a>
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="privacy.html">Polityka Prywatności</a>
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="contact.html">Kontakt</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        let currentUser = null;
        let currentForumId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Inicjalizacja forum...');
            
            try {
                // Sprawdź status autentykacji
                const statusResponse = await fetch('/api/auth/status', {
                    credentials: 'include'
                });
                if (statusResponse.status === 401) {
                    console.log('ℹ️ Użytkownik niezalogowany (status: 401) - ładowanie forum jako gość');
                    currentUser = null;
                } else if (statusResponse.ok) {
                    currentUser = await statusResponse.json();
                    console.log('✅ Zalogowany:', currentUser.username);
                    showUserAvatar(currentUser);
                } else {
                    console.log('❌ Brak autentykacji - wyświetlanie przycisków logowania');
                    showLoginButtons();
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }

                // Sprawdź, czy w URL jest forumId — jeśli tak, załaduj wątki, inaczej kategorie
                const params = new URLSearchParams(window.location.search);
                currentForumId = params.get('forumId');
                if (currentForumId) {
                    await loadForumThreads(parseInt(currentForumId, 10));
                } else {
                    await loadForumCategories();
                }
                
            } catch (error) {
                console.error('❌ Błąd autoryzacji:', error);
                showLoginButtons();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }

            // Search functionality
            setupSearch();
            document.getElementById('new-thread-btn-top').addEventListener('click', function() {
                // Jeśli przeglądamy konkretne forum, otwórz modal z wybranym forum
                if (currentForumId) openThreadModal(currentForumId);
                else openThreadModal();
            });
        });


        function showLoginButtons() {
            const authContainer = document.getElementById('auth-container');
            authContainer.innerHTML = `
                <div class="flex space-x-4">
                    <a href="/login.html" class="bg-white text-blue-700 px-4 py-2 rounded hover:bg-gray-100 font-medium">
                        Logowanie
                    </a>
                    <a href="/register.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">
                        Rejestracja
                    </a>
                </div>
            `;
        }

        function showUserAvatar(userData) {
            const authContainer = document.getElementById('auth-container');
            const userInitial = userData.username.charAt(0).toUpperCase();
            
            authContainer.innerHTML = `
                <div class="relative flex items-center gap-3">
                    <button id="avatar-btn" class="js-avatar-btn w-10 h-10 bg-blue-500 text-white rounded-full hover:ring-2 hover:ring-blue-400/50 transition-all flex items-center justify-center text-lg cursor-pointer" aria-label="Avatar"></button>
                    <span id="header-username" class="hidden md:inline font-semibold text-gray-900 dark:text-white">${userData.username}</span>

                    <div id="avatar-menu" class="js-avatar-menu hidden absolute right-0 top-full mt-2 w-48 bg-white dark:bg-[#192231] rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-2 z-50">
                        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
                            <p class="text-sm font-semibold text-gray-900 dark:text-white">${userData.username}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">${userData.email || 'Brak e-maila'}</p>
                        </div>

                        <a href="/profile.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#2a3851] transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">person</span>Mój profil
                        </a>

                        <a href="/messages.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#2a3851] transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">mail</span>Wiadomości
                        </a>

                        <hr class="my-1 border-gray-200 dark:border-gray-700">

                        <button id="logout-btn" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">logout</span>Wyloguj się
                        </button>
                    </div>
                </div>
            `;
            
            // Wylogowanie
            const logoutBtn = document.querySelector('#logout-btn');
            logoutBtn?.addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/auth/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        console.log('🚪 Wylogowano');
                        window.location.href = '/login.html';
                    }
                } catch (error) {
                    console.error('❌ Błąd wylogowania:', error);
                }
            });
        }

        function setupSearch() {
            const searchToggle = document.getElementById('search-toggle');
            const searchContainer = document.getElementById('search-container');
            const searchInput = document.getElementById('search-input');
            const searchClose = document.getElementById('search-close');

            if (searchToggle && searchContainer && searchInput && searchClose) {
                searchToggle.addEventListener('click', function() {
                    searchContainer.classList.remove('hidden');
                    searchContainer.classList.add('flex');
                    searchInput.focus();
                });

                searchClose.addEventListener('click', function() {
                    closeSearchBar();
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && !searchContainer.classList.contains('hidden')) {
                        closeSearchBar();
                    }
                });

                function closeSearchBar() {
                    searchContainer.classList.add('hidden');
                    searchContainer.classList.remove('flex');
                    searchInput.value = '';
                }
            }
        }

        async function loadForumCategories() {
            try {
                const response = await fetch('/api/forum/categories', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error').classList.remove('hidden');
                    return;
                }

                const categories = await response.json(); // <- TU powstaje zmienna categories
                console.log('📂 Kategorie:', categories);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                // wywołanie funkcji renderującej z przekazaniem categories
                renderCategories(categories);

                // jeśli potrzebujesz selecta w modalu
                populateForumSelect(categories);

            } catch (error) {
                console.error('❌ Błąd ładowania kategorii:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }


       
        function renderCategories(categories) {
            const content = document.getElementById('content');

            // Bezpieczne sprawdzenie, czy categories istnieje i jest tablicą
            if (!Array.isArray(categories)) {
                content.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-400">Brak kategorii</p>`;
                return;
            }

            let html = `<div class="flex flex-col gap-8">`;
            if (categories.length === 0) {
                html += `<p class="text-center text-gray-500 dark:text-gray-400">Brak kategorii</p>`;
            } else {
                categories.forEach(category => {
                    html += `
                        <div class="category-card bg-white dark:bg-[#192231] rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                            <details class="category-details" open>
                                <summary class="category-header flex items-center justify-between p-6 cursor-pointer hover:bg-gray-50 dark:hover:bg-[#232f48] transition-colors">
                                    <div class="flex items-center gap-3">
                                        <span class="text-2xl">${category.icon || '📂'}</span>
                                        <div>
                                            <h3 class="text-lg font-bold text-gray-900 dark:text-white">${category.name}</h3>
                                            <p class="text-sm text-gray-500 dark:text-gray-400">${category.description || ''}</p>
                                        </div>
                                    </div>
                                    <span class="material-symbols-outlined text-gray-600 dark:text-gray-400">expand_more</span>
                                </summary>
                                
                                <div class="category-content border-t border-gray-200 dark:border-gray-700">
                                    ${(category.forums ?? []).length === 0 ? '<p class="text-center text-gray-500 p-4">Brak forów</p>' : ''}
                                    ${(category.forums ?? []).map(forum => `
                                        <a href="forums.html?forumId=${forum.id}" data-forum-id="${forum.id}" onclick="window.location.href='forums.html?forumId=${forum.id}'" class="forum-thread border-b border-gray-200 dark:border-gray-700 p-6 hover:bg-gray-50 dark:hover:bg-[#232f48] transition-colors last:border-b-0 block">
                                            <div class="flex items-start justify-between">
                                                <div class="flex-1">
                                                    <h4 class="text-base font-semibold text-gray-900 dark:text-white mb-2">${escapeHtml(forum.name)}</h4>
                                                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">${escapeHtml(forum.description || '')}</p>
                                                    <div class="flex gap-6 text-sm">
                                                        <span class="text-gray-500 dark:text-gray-400">📊 ${forum.threadCount} wątków</span>
                                                        <span class="text-gray-500 dark:text-gray-400">💬 ${forum.messageCount} postów</span>
                                                    </div>
                                                </div>
                                                <span class="text-gray-400 ml-4">→</span>
                                            </div>
                                        </a>
                                    `).join('')}
                                </div>
                            </details>
                        </div>
                    `;
                });
            }
            
            html += `</div>`;
            content.innerHTML = html;
            // Attach interactions to newly rendered forum cards
            try {
                if (typeof setupForumInteractions === 'function') setupForumInteractions();
            } catch (e) {
                console.warn('setupForumInteractions not available yet', e);
            }

            
        }

        // Helper do ochrony przed XSS
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }


            
        

        // Nowa funkcja do ładowania wątków konkretnego forum
        async function loadForumThreads(forumId) {
            try {
                const response = await fetch(`/api/forum/forum/${forumId}`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error').classList.remove('hidden');
                    return;
                }
                
                const data = await response.json();
                console.log('📋 Forum wątki:', data);
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                renderForumThreads(data);
                
            } catch (error) {
                console.error('❌ Błąd ładowania wątków forum:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        // Render wątków dla konkretnego forum
        function renderForumThreads(data) {
            const content = document.getElementById('content');
            const forum = data.Forum || data.forum;
            const threads = data.Threads || data.threads || [];

            let html = `
                <div class="mb-6 flex items-center gap-4">
                    <a href="forum.html" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors inline-block">
                        ← Powrót do kategorii
                    </a>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">${escapeHtml(forum.name || '')}</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400">${escapeHtml(forum.description || '')}</p>
                    </div>
                </div>
                <div class="space-y-4">
            `;

            if (!Array.isArray(threads) || threads.length === 0) {
                html += `<p class="text-center text-gray-500 dark:text-gray-400 py-8">Brak wątków w tym forum</p>`;
            } else {
                threads.forEach(thread => {
                    html += `
                        <a href="thread.html?threadId=${thread.id}" class="block bg-white dark:bg-[#192231] p-6 rounded-lg border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">${escapeHtml(thread.title || '')}</h3>
                                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">Autor: ${escapeHtml(thread.author?.username || thread.authorName || 'Anonimowo')}</p>
                                    <div class="flex gap-6 text-sm">
                                        <span class="text-gray-500 dark:text-gray-400">💬 ${thread.repliesCount || thread.replyCount || 0} odpowiedzi</span>
                                        <span class="text-gray-500 dark:text-gray-400">👁️ ${thread.views || 0} wyświetleń</span>
                                    </div>
                                </div>
                                <div class="text-right ml-4">
                                    <p class="text-xs text-gray-400">${new Date(thread.createdAt).toLocaleDateString('pl-PL')}</p>
                                </div>
                            </div>
                        </a>
                    `;
                });
            }

            html += `</div>`;
            content.innerHTML = html;
        }

        // Helper do ochrony przed XSS
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

            function populateForumSelect(categories) {

            const content = document.getElementById('content');

            let html = `<div class="flex flex-col gap-8">`;

            if (categories.length === 0) {
                html += `<p class="text-center text-gray-500 dark:text-gray-400">Brak kategorii</p>`;
            } else {
                categories.forEach(category => {
                    html += `
                        <div class="category-card bg-white dark:bg-[#192231] rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                            <details class="category-details" open>
                                <summary class="category-header flex items-center justify-between p-6 cursor-pointer hover:bg-gray-50 dark:hover:bg-[#232f48] transition-colors">
                                    <div class="flex items-center gap-3">
                                        <span class="text-2xl">${category.icon || '📂'}</span>
                                        <div>
                                            <h3 class="text-lg font-bold text-gray-900 dark:text-white">${category.name}</h3>
                                            <p class="text-sm text-gray-500 dark:text-gray-400">${category.description || ''}</p>
                                        </div>
                                    </div>
                                    <span class="material-symbols-outlined text-gray-600 dark:text-gray-400">expand_more</span>
                                </summary>
                                
                                <div class="category-content border-t border-gray-200 dark:border-gray-700">
                                    ${(category.forums ?? []).length === 0 ? '<p class="text-center text-gray-500 p-4">Brak forów</p>' : ''}
                                    ${(category.forums ?? []).map(forum => `
                                        <div data-forum-id="${forum.id}" onclick="window.location.href='forums.html?forumId=${forum.id}'" class="forum-thread border-b border-gray-200 dark:border-gray-700 p-6 hover:bg-gray-50 dark:hover:bg-[#232f48] transition-colors last:border-b-0">
                                            <div class="flex items-start justify-between">
                                                <div class="flex-1">
                                                    <h4 class="text-base font-semibold text-gray-900 dark:text-white mb-2">${forum.name}</h4>
                                                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">${forum.description || ''}</p>
                                                    <div class="flex gap-6 text-sm">
                                                        <span class="text-gray-500 dark:text-gray-400">📊 ${forum.threadCount} wątków</span>
                                                        <span class="text-gray-500 dark:text-gray-400">💬 ${forum.messageCount} postów</span>
                                                    </div>
                                                </div>
                                                
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        </div>
                    `;
                });
            }
            
            html += `</div>`;
            content.innerHTML = html;

            
            
        }

            function populateForumSelect(categories) {
            const select = document.getElementById('thread-forum');

            // Wyczyść poprzednią zawartość
            select.innerHTML = `<option value="">Wybierz forum...</option>`;

            if (!Array.isArray(categories)) {
                console.error("populateForumSelect: categories is not an array:", categories);
                return;
            }

            categories.forEach(category => {
                if (!Array.isArray(category.forums)) return;

                category.forums.forEach(forum => {
                    const option = document.createElement('option');
                    option.value = forum.id;
                    option.textContent = `${category.name} > ${forum.name}`;
                    select.appendChild(option);
                });
            });
        }


        function openThreadModal(forumId = null, forumName = null) {
            const modal = document.getElementById('new-thread-modal');
            const forumSelect = document.getElementById('thread-forum');
            const titleInput = document.getElementById('thread-title');
            const contentInput = document.getElementById('thread-content');

            // Wyczyść formularz
            titleInput.value = '';
            contentInput.value = '';

            // Ustaw forum jeśli podano
            if (forumId) {
                forumSelect.value = forumId;
            }

            // Otwórz modal
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeThreadModal() {
            const modal = document.getElementById('new-thread-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Obsługa przycisków modal
        document.getElementById('close-modal').addEventListener('click', closeThreadModal);
        document.getElementById('cancel-modal').addEventListener('click', closeThreadModal);

        // Zamknij modal po kliknięciu poza nim
        document.getElementById('new-thread-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeThreadModal();
            }
        });

               // Obsługa tworzenia wątku
        document.getElementById('create-thread-btn').addEventListener('click', async function() {
            const forumId = document.getElementById('thread-forum').value;
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();

            // Walidacja
            if (!forumId) {
                alert('⚠️ Wybierz forum');
                return;
            }
            if (!title) {
                alert('⚠️ Wpisz tytuł');
                return;
            }
            if (!content) {
                alert('⚠️ Wpisz treść');
                return;
            }
            if (title.length < 3) {
                alert('⚠️ Tytuł musi mieć co najmniej 3 znaki');
                return;
            }
            if (content.length < 10) {
                alert('⚠️ Treść musi mieć co najmniej 10 znaków');
                return;
            }

            try {
                const response = await fetch('/api/forum/thread', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        forumId: parseInt(forumId)
                    })
                });

                if (response.ok) {
                    alert('✅ Wątek został utworzony!');
                    closeThreadModal();
                    // Odśwież listę
                    location.reload();
                } else {
                    const error = await response.json();
                    const errMsg = error.error || error.message || (error.bannedWords ? ('Wątek zawiera zakazane słowa: ' + (Array.isArray(error.bannedWords) ? error.bannedWords.join(', ') : error.bannedWords)) : 'Nie udało się utworzyć wątku');
                    alert('❌ Błąd: ' + errMsg);
                }
            } catch (error) {
                alert('❌ Błąd podczas tworzenia wątku: ' + error.message);
            }
        });

        // Logo and Avatar updater
        function initUpdaters() {
            const logoContainer = document.getElementById('logo-container');
            const authContainer = document.getElementById('auth-container');

            async function updateLogo() {
                if (!logoContainer) return;
                try {
                    const response = await fetch('/api/admin/settings/logo');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.logoUrl) {
                            logoContainer.innerHTML = `
                                <div class="flex items-center">
                                    <img src="${data.logoUrl}" alt="Logo" class="h-8 w-auto mr-2">
                                </div>
                                <h1 class="text-xl font-bold text-gray-900 dark:text-white">${data.forumName || 'Forum Dyskusyjne'}</h1>
                            `;
                        }
                    }
                } catch (e) {
                    console.warn('Logo update failed:', e);
                }
            }

            async function updateAvatar() {
                if (!authContainer) return;
                try {
                    const statusResponse = await fetch('/api/auth/status', {
                        method: 'GET',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (statusResponse.ok) {
                        const currentUser = await statusResponse.json();
                        if (currentUser && currentUser.id) {
                            const userResponse = await fetch(`/api/users/${currentUser.id}`, {
                                credentials: 'include'
                            });
                            if (userResponse.ok) {
                                const user = await userResponse.json();
                                const userInitial = (user.username || 'U').charAt(0).toUpperCase();
                                const avatarBtn = authContainer.querySelector('.js-avatar-btn, #avatar-btn');
                                if (avatarBtn) {
                                    if (user.avatarUrl) {
                                        avatarBtn.style.backgroundImage = `url(${user.avatarUrl})`;
                                        avatarBtn.style.backgroundSize = 'cover';
                                        avatarBtn.style.backgroundPosition = 'center';
                                        avatarBtn.textContent = '';
                                    } else {
                                        avatarBtn.style.backgroundImage = '';
                                        avatarBtn.textContent = userInitial;
                                    }
                                }
                                const headerName = authContainer.querySelector('#header-username');
                                if (headerName && user.username) headerName.textContent = user.username;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Avatar update failed:', e);
                }
            }

            updateLogo();
            updateAvatar();
            // Refresh every 30 seconds
            setInterval(() => {
                updateLogo();
                updateAvatar();
            }, 30000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initUpdaters);
        } else {
            initUpdaters();
        }
    </script>

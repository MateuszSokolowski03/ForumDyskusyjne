<!DOCTYPE html>
<html class="dark" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Dyskusyjne - Kategorie</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-50 bg-white/95 dark:bg-[#111722]/95 backdrop-blur-sm border-b border-gray-200 dark:border-[#232f48]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center gap-4">
                        <div id="logo-container" class="flex items-center gap-3">
                            <div class="text-primary flex items-center">
                                <span class="material-symbols-outlined text-2xl hidden sm:inline">forum</span>
                            </div>
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Forum Dyskusyjne</h1>
                        </div>
                    </div>

                    <nav class="hidden md:flex items-center gap-6">
                        <a href="/" class="nav-item" title="Strona główna">🏠</a>
                        <a href="forum.html" class="nav-item nav-item--active" title="Kategorie">📂</a>
                        <a href="messages.html" class="nav-item" title="Wiadomości">💬</a>
                        <button id="search-toggle" class="nav-item" title="Szukaj">🔍</button>
                    </nav>

                    <div class="flex items-center gap-4">
                        <div id="search-container" class="hidden items-center relative">
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 text-sm">search</span>
                                <input id="search-input" type="text" placeholder="Szukaj..." class="w-40 md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                                <button id="search-close" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                                    <span class="material-symbols-outlined text-sm">close</span>
                                </button>
                            </div>
                        </div>
                        <div id="auth-container" class="relative"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Kategorie Forum</h1>
                    <button id="new-thread-btn-top" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                        <span class="material-symbols-outlined align-middle">add_circle</span> Nowy wątek
                    </button>
                </div>
                <div id="loading" class="text-center py-8">
                    <p class="text-gray-600 dark:text-gray-400">⏳ Ładowanie forum...</p>
                </div>
                <div id="content" class="hidden"></div>
                <div id="error" class="hidden text-center py-8">
                    <p class="text-red-600 dark:text-red-400">❌ Błąd ładowania forum</p>
                </div>
            </div>
        </main>

        <div id="new-thread-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-[#192231] rounded-xl shadow-lg max-w-2xl w-full border border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                    <div>
                        <h3 class="text-xl font-bold text-gray-900 dark:text-white">Nowy Wątek</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">⚠️ Wątek nie może zawierać zakazanych słów</p>
                    </div>
                    <button id="close-modal" class="text-gray-500 dark:text-gray-400 hover:text-gray-700">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label for="thread-forum" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Wybierz forum:</label>
                        <select id="thread-forum" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2">
                            <option value="">Wybierz forum...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Tytuł Wątku</label>
                        <input id="thread-title" type="text" placeholder="Wpisz tytuł wątku..." class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Treść</label>
                        <textarea id="thread-content" placeholder="Opisz swoją wiadomość..." rows="6" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:ring-2 focus:ring-primary"></textarea>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200 dark:border-gray-700">
                    <button id="cancel-modal" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#232f48]">Anuluj</button>
                    <button id="create-thread-btn" class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-primary/90 font-medium">Utwórz Wątek</button>
                </div>
            </div>
        </div>

        <footer class="mt-auto border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-[#192231]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <p class="text-sm text-gray-500 dark:text-gray-400">© 2024 Forum Dyskusyjne. Wszelkie prawa zastrzeżone.</p>
                    <div class="flex gap-6 text-sm">
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 transition-colors" href="rules.html">Regulamin</a>
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 transition-colors" href="privacy.html">Polityka Prywatności</a>
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 transition-colors" href="contact.html">Kontakt</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

<script src="js/main.js"></script>
    <script>
        let currentForumId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            // 1. Najpierw pobierz paramsy
            const params = new URLSearchParams(window.location.search);
            currentForumId = params.get('forumId');

            // 2. ZAWSZE pobierz kategorie, aby wypełnić select w modalu "Nowy wątek"
            // Dzięki temu dropdown będzie miał opcje, nawet jak jesteśmy wewnątrz konkretnego forum
            let categoriesData = [];
            try {
                categoriesData = await fetchCategories();
                populateForumSelect(categoriesData);
            } catch (e) {
                console.error("Nie udało się pobrać struktury forum dla selecta", e);
            }

            // 3. Decyzja co wyświetlić w głównej treści
            if (currentForumId) {
                // Jesteśmy w konkretnym forum - ładujemy wątki
                await loadForumThreads(parseInt(currentForumId, 10));
            } else {
                // Jesteśmy na głównej stronie forum - wyświetlamy kategorie (używając pobranych wcześniej danych)
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                renderCategories(categoriesData);
            }

            // 4. Obsługa przycisku
            document.getElementById('new-thread-btn-top').addEventListener('click', () => {
                // Przekazujemy aktualne ID, żeby modal wiedział co zaznaczyć
                openThreadModal(currentForumId);
            });
        });

        // Nowa funkcja pomocnicza do pobierania danych
        async function fetchCategories() {
            const response = await fetch('/api/forum/categories', { credentials: 'include' });
            if (!response.ok) throw new Error('Network error');
            return await response.json();
        }

        // Ta funkcja już nie pobiera danych, tylko je renderuje
        function renderCategories(categories) {
            const content = document.getElementById('content');
            if (!Array.isArray(categories) || categories.length === 0) {
                content.innerHTML = `<p class="text-center text-gray-500">Brak kategorii</p>`;
                return;
            }

            content.innerHTML = `<div class="flex flex-col gap-8">` + categories.map(category => `
                <div class="category-card bg-white dark:bg-[#192231] rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
                    <details class="category-details" open>
                        <summary class="flex items-center justify-between p-6 cursor-pointer hover:bg-gray-50 dark:hover:bg-[#232f48] transition-colors">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">${category.icon || '📂'}</span>
                                <div>
                                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">${escapeHtml(category.name)}</h3>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">${escapeHtml(category.description || '')}</p>
                                </div>
                            </div>
                            <span class="material-symbols-outlined text-gray-600">expand_more</span>
                        </summary>
                        <div class="border-t border-gray-200 dark:border-gray-700">
                            ${(category.forums || []).map(forum => `
                                <a href="forum.html?forumId=${forum.id}" class="block border-b border-gray-200 dark:border-gray-700 p-6 hover:bg-gray-50 dark:hover:bg-[#232f48] transition-colors last:border-b-0">
                                    <div class="flex items-start justify-between">
                                        <div class="flex-1">
                                            <h4 class="text-base font-semibold text-gray-900 dark:text-white mb-2">${escapeHtml(forum.name)}</h4>
                                            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">${escapeHtml(forum.description || '')}</p>
                                            <div class="flex gap-6 text-sm text-gray-500">
                                                <span>📊 ${forum.threadCount} wątków</span>
                                                <span>💬 ${forum.messageCount} postów</span>
                                            </div>
                                        </div>
                                        <span class="text-gray-400">→</span>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </details>
                </div>
            `).join('') + `</div>`;
        }

        async function loadForumThreads(forumId) {
            try {
                const response = await fetch(`/api/forum/forum/${forumId}`, { credentials: 'include' });
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                renderForumThreads(data);
            } catch (error) {
                console.error('❌ Błąd wątków:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderForumThreads(data) {
            const content = document.getElementById('content');
            const forum = data.Forum || data.forum || {};
            const threads = data.Threads || data.threads || [];

            content.innerHTML = `
                <div class="mb-6 flex items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">${escapeHtml(forum.name || 'Forum')}</h2>
                    </div>
                </div>
                <div class="space-y-4">
                    ${threads.length === 0 ? '<p class="text-center text-gray-500 py-8">Brak wątków w tym forum.</p>' : threads.map(thread => `
                        <a href="thread.html?threadId=${thread.id}" class="block bg-white dark:bg-[#192231] p-6 rounded-lg border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">${escapeHtml(thread.title || '')}</h3>
                                    <p class="text-sm text-gray-500 mb-3">Autor: ${escapeHtml(thread.author?.username || thread.authorName || 'Anonim')}</p>
                                    <div class="flex gap-6 text-sm text-gray-400">
                                        <span>💬 ${thread.repliesCount || 0}</span>
                                        <span>👁️ ${thread.views || 0}</span>
                                    </div>
                                </div>
                                <span class="text-xs text-gray-400">${new Date(thread.createdAt).toLocaleDateString('pl-PL')}</span>
                            </div>
                        </a>
                    `).join('')}
                </div>`;
        }

        function populateForumSelect(categories) {
            const select = document.getElementById('thread-forum');
            select.innerHTML = `<option value="">Wybierz forum...</option>`;
            categories.forEach(cat => {
                (cat.forums || []).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = `${cat.name} > ${f.name}`;
                    select.appendChild(opt);
                });
            });
        }

        function openThreadModal(forumId = null) {
            const modal = document.getElementById('new-thread-modal');
            const select = document.getElementById('thread-forum');
            
            // Otwórz modal
            modal.classList.replace('hidden', 'flex');

            // Jeśli mamy forumId (np. z URL), ustawiamy je w selectcie
            if (forumId) {
                select.value = forumId;
                // Opcjonalnie: Zablokuj zmianę, jeśli chcesz wymusić to forum
                // select.disabled = true; 
            } else {
                select.value = "";
                // select.disabled = false;
            }
        }

        function closeThreadModal() {
            document.getElementById('new-thread-modal').classList.replace('flex', 'hidden');
        }

        document.getElementById('close-modal').onclick = closeThreadModal;
        document.getElementById('cancel-modal').onclick = closeThreadModal;
        
        document.getElementById('create-thread-btn').onclick = async () => {
            const forumId = document.getElementById('thread-forum').value;
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();

            if (!forumId || !title || !content) return alert('Wypełnij wszystkie pola');

            try {
                const res = await fetch('/api/forum/thread', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ title, content, forumId: parseInt(forumId) })
                });

                if (res.ok) {
                    alert('✅ Wątek utworzony!');
                    location.reload();
                } else {
                    const err = await res.json();
                    alert('❌ Błąd: ' + (err.error || 'Nie udało się utworzyć wątku'));
                }
            } catch (e) { alert('❌ Błąd połączenia'); }
        };

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>

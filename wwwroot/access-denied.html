<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brak dostępu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        body { background: #181c23; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #232f48; padding: 2rem 3rem; border-radius: 1rem; box-shadow: 0 2px 16px #0002; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; }
        a { color: #7fa7ff; text-decoration: underline; }

</head>
<body>
    <div class="box">
        <h1>Brak dostępu</h1>
        <p>Nie masz uprawnień do przeglądania tej strony.</p>
        <p><a href="/">Powrót na stronę główną</a></p>
    </div>
</body>
</html>

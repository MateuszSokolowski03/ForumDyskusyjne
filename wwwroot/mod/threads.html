<!DOCTYPE html>
<html class="dark" lang="pl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wątki i Wiadomości - Panel Moderatora</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
    <div class="admin-layout relative flex min-h-screen w-full overflow-x-hidden">
        <div class="admin-wrapper flex flex-col md:flex-row w-full min-h-screen">
            <aside class="admin-sidebar w-full md:w-64 h-screen bg-white dark:bg-[#192231] border-b md:border-r border-gray-200 dark:border-[#232f48] flex-shrink-0 sticky top-0 z-40 overflow-y-auto">
                <div class="sidebar-header p-4 flex items-center gap-3 border-b border-gray-200 dark:border-[#232f48]">
                    <div class="admin-icon size-8 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined !text-4xl">shield_person</span>
                    </div>
                    <h1 class="admin-title text-xl font-bold text-gray-900 dark:text-white">Moderator Panel</h1>
                </div>
                <nav class="sidebar-nav p-4 flex-grow" aria-label="Menu moderatora">
                    <ul class="nav-list space-y-2">
                        <li><a class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#232f48] text-gray-600 dark:text-gray-300" href="overview.html" title="Przegląd">
                            <span class="material-symbols-outlined">dashboard</span>Przegląd
                        </a></li>
                        <li><a class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#232f48] text-gray-600 dark:text-gray-300" href="users.html" title="Użytkownicy">
                            <span class="material-symbols-outlined">group</span>Użytkownicy
                        </a></li>
                        <li><a class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#232f48] text-gray-600 dark:text-gray-300" href="forums.html" title="Kategorie i Fora">
                            <span class="material-symbols-outlined">category</span>Fora
                        </a></li>
                        <li><a class="nav-item active flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 dark:bg-primary/20 text-primary dark:text-white font-semibold" href="threads.html" title="Wątki i wiadomości">
                            <span class="material-symbols-outlined">forum</span>Wątki
                        </a></li>
                    </ul>
                </nav>
                <div class="sidebar-footer p-4 border-t border-gray-200 dark:border-[#232f48]">
                    <a class="home-btn flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-[#232f48] text-gray-600 dark:text-gray-300" href="/">
                        <span class="material-symbols-outlined">logout</span>Strona Główna
                    </a>
                </div>
            </aside>

            <main class="main-content flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto" role="main">
                <div class="content-wrapper max-w-7xl mx-auto">
                    <header class="page-header mb-8 w-full">
                        <h2 class="main-title text-3xl font-bold text-gray-900 dark:text-white">Wątki i Wiadomości</h2>
                        <p class="page-subtitle text-gray-500 dark:text-gray-400 mt-1">Zarządzaj wątkami w forach przypisanych do Twojego konta.</p>
                    </header>
                    
                    <section class="mod-threads-section bg-white dark:bg-[#192231] rounded-xl shadow-sm border border-gray-200 dark:border-[#232f48] overflow-hidden w-full">
                        <div id="mod-threads-list" class="divide-y divide-gray-200 dark:divide-[#2a3851]">
                            <div class="p-8 text-center text-gray-500">Ładowanie wątków...</div>
                        </div>

                        <div class="pagination-section p-4 bg-gray-50 dark:bg-[#101622] border-t border-gray-200 dark:border-[#232f48] flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div class="pagination-info text-sm text-gray-500 dark:text-gray-400">
                                Pokazuję <span id="results-start">0</span>-<span id="results-end">0</span> z <span id="results-total">0</span> wątków
                            </div>
                            <div class="pagination-controls flex gap-2">
                                <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-[#232f48] disabled:opacity-50 disabled:cursor-not-allowed transition-colors" 
                                        id="prev-btn" onclick="changePage(-1)" disabled>
                                    <span class="material-symbols-outlined text-sm">chevron_left</span>
                                </button>
                                
                                <div class="flex gap-1" id="pagination-numbers"></div>

                                <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-[#232f48] disabled:opacity-50 disabled:cursor-not-allowed transition-colors" 
                                        id="next-btn" onclick="changePage(1)" disabled>
                                    <span class="material-symbols-outlined text-sm">chevron_right</span>
                                </button>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // --- ZMIENNE GLOBALNE ---
        let allThreads = []; 
        let currentPage = 1;
        const pageSize = 10; 

        // --- POBIERANIE DANYCH ---
        async function loadThreads() {
            const container = document.getElementById('mod-threads-list');
            
            try {
                // Używamy endpointu Moderatora: /api/mod/threads
                const res = await fetch('/api/mod/threads', { credentials: 'include' });
                
                if (!res.ok) {
                    throw new Error(`Błąd API: ${res.status}`);
                }

                allThreads = await res.json();
                
                // Sortowanie po dacie (najnowsze)
                allThreads.sort((a, b) => new Date(b.createdAt || b.CreatedAt) - new Date(a.createdAt || a.CreatedAt));

                currentPage = 1;
                renderPage();

            } catch (error) {
                console.error('Błąd:', error);
                container.innerHTML = `<div class="p-8 text-center text-red-500">
                    <span class="block text-xl mb-2">⚠️</span>
                    Nie udało się pobrać listy wątków.<br>
                    <span class="text-sm text-gray-400">${error.message}</span>
                </div>`;
            }
        }

        // --- RENDEROWANIE WĄTKÓW ---
        function renderPage() {
            const container = document.getElementById('mod-threads-list');
            const totalItems = allThreads.length;

            if (totalItems === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500 flex flex-col items-center">
                    <span class="material-symbols-outlined text-4xl mb-2 text-gray-400">forum</span>
                    Brak wątków w przypisanych forach.
                </div>`;
                updatePaginationControls(0, 0, 0, 0);
                return;
            }

            const totalPages = Math.ceil(totalItems / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const threadsToShow = allThreads.slice(start, end);

            container.innerHTML = threadsToShow.map(t => {
                const date = new Date(t.createdAt || t.CreatedAt).toLocaleDateString('pl-PL', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                
                return `
                <div class="group p-4 hover:bg-gray-50 dark:hover:bg-[#1e293b] transition-colors border-b border-gray-100 dark:border-gray-800 last:border-0">
                    <div class="flex flex-col sm:flex-row justify-between gap-4">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-base font-semibold text-gray-900 dark:text-white truncate pr-4">
                                <a href="/thread.html?id=${t.id}" target="_blank" class="hover:text-primary hover:underline transition-colors" title="${escapeHtml(t.title)}">
                                    ${escapeHtml(t.title)}
                                </a>
                            </h3>
                            <div class="mt-1.5 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-500 dark:text-gray-400">
                                <span class="flex items-center gap-1.5" title="Autor">
                                    <span class="material-symbols-outlined !text-[16px]">person</span> 
                                    ${escapeHtml(t.authorName || 'Anonim')}
                                </span>
                                <span class="flex items-center gap-1.5" title="Forum">
                                    <span class="material-symbols-outlined !text-[16px]">folder</span> 
                                    ${escapeHtml(t.forumName || 'Nieznane')}
                                </span>
                                <span class="flex items-center gap-1.5" title="Data utworzenia">
                                    <span class="material-symbols-outlined !text-[16px]">calendar_today</span> 
                                    ${date}
                                </span>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between sm:justify-end gap-6 shrink-0">
                            <div class="flex gap-4 text-xs font-medium text-gray-400 uppercase tracking-wide">
                                <span class="flex items-center gap-1" title="Liczba odpowiedzi">
                                    <span class="material-symbols-outlined !text-base">chat_bubble</span> ${t.repliesCount || 0}
                                </span>
                                <span class="flex items-center gap-1" title="Liczba wyświetleń">
                                    <span class="material-symbols-outlined !text-base">visibility</span> ${t.views || 0}
                                </span>
                            </div>
                            
                            <div class="flex gap-2">
                                <a href="/thread.html?id=${t.id}" target="_blank" 
                                   class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 hover:bg-blue-100 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" 
                                   title="Zobacz wątek">
                                    <span class="material-symbols-outlined !text-lg">visibility</span>
                                </a>
                                <button onclick="deleteThread(${t.id})" 
                                        class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 hover:bg-red-100 dark:hover:bg-red-900/30 hover:text-red-600 dark:hover:text-red-400 transition-colors" 
                                        title="Usuń wątek">
                                    <span class="material-symbols-outlined !text-lg">delete</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');

            updatePaginationControls(currentPage, totalItems, start + 1, Math.min(end, totalItems));
        }

        // --- USUWANIE WĄTKU ---
        async function deleteThread(threadId) {
            if (!confirm('Czy na pewno chcesz usunąć ten wątek? Operacja jest nieodwracalna.')) return;

            try {
                // Endpoint DELETE z ModApiController
                const res = await fetch(`/api/mod/threads/${threadId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (!res.ok) {
                    const err = await res.text(); // Może nie być JSON
                    throw new Error(err || 'Błąd usuwania');
                }

                alert('Wątek został usunięty.');
                // Odśwież dane
                loadThreads();

            } catch (error) {
                console.error('Błąd:', error);
                alert('Nie udało się usunąć wątku. Masz uprawnienia tylko do przypisanych forów.');
            }
        }

        // --- KONTROLKI PAGINACJI ---
        function updatePaginationControls(page, total, start, end) {
            const totalPages = Math.ceil(total / pageSize) || 1;

            const startEl = document.getElementById('results-start');
            const endEl = document.getElementById('results-end');
            const totalEl = document.getElementById('results-total');
            
            if(startEl) startEl.textContent = start;
            if(endEl) endEl.textContent = end;
            if(totalEl) totalEl.textContent = total;

            document.getElementById('prev-btn').disabled = page <= 1;
            document.getElementById('next-btn').disabled = page >= totalPages;

            const container = document.getElementById('pagination-numbers');
            container.innerHTML = '';

            let startPage = Math.max(1, page - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === page;
                const activeClass = "bg-primary text-white border-primary";
                const inactiveClass = "bg-white dark:bg-[#192231] text-gray-600 dark:text-gray-400 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-[#232f48]";
                
                const btn = document.createElement('button');
                btn.className = `w-8 h-8 flex items-center justify-center rounded-lg text-sm font-medium border transition-colors ${isActive ? activeClass : inactiveClass}`;
                btn.textContent = i;
                
                if (isActive) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => {
                        currentPage = i;
                        renderPage();
                        document.querySelector('.main-content').scrollTop = 0;
                    };
                }
                container.appendChild(btn);
            }
        }

        function changePage(delta) {
            const totalPages = Math.ceil(allThreads.length / pageSize);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage();
                document.querySelector('.main-content').scrollTop = 0;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        document.addEventListener('DOMContentLoaded', loadThreads);
    </script>
</body>
</html>

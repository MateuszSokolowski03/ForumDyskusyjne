            <!-- Empty State -->

            <script>
            function updateChatUI() {
                const empty = document.getElementById('empty-state');
                const inputArea = document.getElementById('message-input-area');

                if (empty && inputArea) {
                    if (!empty.classList.contains('hidden')) {
                        inputArea.classList.add('hidden');
                    } else {
                        inputArea.classList.remove('hidden');
                    }
                }
            }

            // Wywołuj po zmianie widoczności empty-state i po ładowaniu strony
            document.addEventListener('DOMContentLoaded', updateChatUI);

            // Jeśli dynamicznie pokazujesz/ukrywasz empty-state w JS, dodaj updateChatUI() w tym miejscu
            </script>

</main>

    <script src="js/main.js" defer></script>
    <script defer>
    let currentUser = null;
    let selectedContactId = null;
    let selectedContactName = null;
    let allChats = [];
    let allUsers = [];

    // Modal do wyboru użytkownika
    function showNewChatModal() {
        const modal = document.createElement('div');
        modal.id = 'new-chat-modal';
        modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
        modal.innerHTML = `
            <div class="bg-white dark:bg-[#192231] rounded-lg shadow-lg max-w-md w-full p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Nowa rozmowa</h2>
                    <button class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" onclick="document.getElementById('new-chat-modal').remove()">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <input 
                    type="text" 
                    id="user-search" 
                    placeholder="Szukaj użytkownika..."
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary mb-4"
                >
                <div id="users-list" class="max-h-64 overflow-y-auto">
                    <p class="text-center text-gray-500 dark:text-gray-400 py-4">Ładowanie użytkowników...</p>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.remove();
        });

        // Dodaj listener DOPIERO PO wstawieniu elementu do DOM
        const searchInput = document.getElementById('user-search');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.username.toLowerCase().includes(query) && u.id !== currentUser.id);
            renderUsersList(filtered);
        });

        loadAllUsers();
    }

    function renderUsersList(users) {
        const container = document.getElementById('users-list');
        if (users.length === 0) {
            container.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 py-4">Brak użytkowników</p>';
            return;
        }

        container.innerHTML = users.map(user => `
            <div 
                class="p-3 hover:bg-gray-100 dark:hover:bg-[#232f48] cursor-pointer border-b border-gray-100 dark:border-[#232f48] transition"
                onclick="startChatWithUser(${user.id}, '${escapeHtml(user.username)}')"
            >
                <p class="font-semibold text-gray-900 dark:text-white">${escapeHtml(user.username)}</p>
            </div>
        `).join('');
    }

    async function loadAllUsers() {
        try {
            const res = await fetchJson('/api/users');
            if (res.ok && Array.isArray(res.json)) {
                allUsers = res.json;
                const filtered = allUsers.filter(u => u.id !== currentUser.id);
                renderUsersList(filtered);
            }
        } catch (error) {
            console.error('Błąd ładowania użytkowników:', error);
            document.getElementById('users-list').innerHTML = '<p class="text-center text-red-500 py-4">Błąd ładowania</p>';
        }
    }

    function startChatWithUser(userId, username) {
        document.getElementById('new-chat-modal').remove();
        selectChat(null, userId, username);
    }

    async function fetchJson(url, opts = {}) {
        try {
            const res = await fetch(url, Object.assign({ credentials: 'include', headers: { 'Accept': 'application/json' } }, opts));
            if (!res.ok) return { ok: false, status: res.status, json: null };
            return { ok: true, status: res.status, json: await res.json() };
        } catch (e) {
            console.error('fetchJson error', url, e);
            return { ok: false, status: 0, json: null };
        }
    }

    function escapeHtml(text) {
        if (!text && text !== 0) return '';
        return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    async function loadCurrentUser() {
        const res = await fetchJson('/api/auth/status');
        if (res.ok && res.json) {
            currentUser = res.json;
            return currentUser;
        }
        return null;
    }

    async function loadChats() {
        const container = document.getElementById('conversations-list');
        container.innerHTML = '<div class="p-4 text-center text-gray-500">⏳ Ładowanie...</div>';

        const inboxRes = await fetchJson('/api/messages/inbox');
        const sentRes = await fetchJson('/api/messages/sent');

        const contactMap = new Map();

        if (inboxRes.ok && Array.isArray(inboxRes.json)) {
            inboxRes.json.forEach(msg => {
                const senderId = msg.senderId;
                const senderName = msg.senderName;
                if (senderId && !contactMap.has(senderId)) {
                    contactMap.set(senderId, { id: senderId, username: senderName, lastMessage: msg.content, timestamp: msg.sentAt });
                }
            });
        }

        if (sentRes.ok && Array.isArray(sentRes.json)) {
            sentRes.json.forEach(msg => {
                const recipientId = msg.recipientId;
                const recipientName = msg.recipientName;
                if (recipientId && !contactMap.has(recipientId)) {
                    contactMap.set(recipientId, { id: recipientId, username: recipientName, lastMessage: msg.content, timestamp: msg.sentAt });
                }
            });
        }

        allChats = Array.from(contactMap.values()).filter(u => u.id !== currentUser.id);

        if (allChats.length === 0) {
            container.innerHTML = '<div class="p-6 text-center text-gray-500 dark:text-gray-400"><p>Brak rozmów</p><p class="text-sm mt-2">Zaproś kogoś, aby rozpocząć czat</p></div>';
            return;
        }

        renderChats(allChats);
    }

    function renderChats(chats) {
        const container = document.getElementById('conversations-list');
        container.innerHTML = chats.map(chat => {
            const initial = (chat.username || 'U').charAt(0).toUpperCase();
            const preview = (chat.lastMessage || '').substring(0, 50) + (chat.lastMessage?.length > 50 ? '...' : '');
            const time = chat.timestamp ? new Date(chat.timestamp).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) : '';
            
                return `
                <div 
                    class="chat-item flex items-center gap-3 p-4 hover:bg-gray-100 dark:hover:bg-[#232f48] cursor-pointer border-b border-gray-100 dark:border-[#232f48] transition ${selectedContactId === chat.id ? 'bg-primary/10 dark:bg-primary/10' : ''}"
                    data-contact-id="${chat.id}"
                    onclick="selectChat(this, ${chat.id}, '${escapeHtml(chat.username)}')"
                >
                    <div class="w-12 h-12 rounded-full chat-avatar flex items-center justify-center text-white font-bold flex-shrink-0 overflow-hidden" style="${chat.avatarUrl ? `background-image:url(${chat.avatarUrl});background-size:cover;background-position:center;` : 'background:linear-gradient(90deg,#60a5fa,#3b82f6);'}">
                        ${!chat.avatarUrl ? initial : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-gray-900 dark:text-white truncate">${escapeHtml(chat.username)}</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400 truncate">${escapeHtml(preview)}</p>
                    </div>
                    <span class="text-xs text-gray-500 dark:text-gray-500 flex-shrink-0">${time}</span>
                </div>
            `;
        }).join('');
    }

    // Refresh avatars for a specific user when their avatar changes
    async function refreshUserAvatar(userId) {
        if (!userId) return;
        try {
            const res = await fetchJson(`/api/users/${userId}`);
            if (!res.ok || !res.json) return;
            const user = res.json;
            const avatarUrl = user.avatarUrl || user.AvatarUrl || null;
            
            // Find chat in list and update its avatarUrl
            const chatObj = allChats.find(c => parseInt(c.id) === parseInt(userId));
            if (chatObj) {
                chatObj.avatarUrl = avatarUrl;
            }

            // Update avatar in conversations list
            const avatarEl = document.querySelector(`.chat-item[data-contact-id="${userId}"] .chat-avatar`);
            if (avatarEl) {
                if (avatarUrl) {
                    avatarEl.style.backgroundImage = `url(${avatarUrl})`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.style.backgroundPosition = 'center';
                    avatarEl.textContent = '';
                } else {
                    avatarEl.style.backgroundImage = '';
                    const username = chatObj?.username || 'U';
                    avatarEl.textContent = username.charAt(0).toUpperCase();
                }
            }

            // If this contact is currently open, update the large contact avatar
            if (selectedContactId && parseInt(selectedContactId) === parseInt(userId)) {
                const contactAvatarEl = document.getElementById('contact-avatar');
                if (contactAvatarEl) {
                    if (avatarUrl) {
                        contactAvatarEl.style.backgroundImage = `url(${avatarUrl})`;
                        contactAvatarEl.style.backgroundSize = 'cover';
                        contactAvatarEl.style.backgroundPosition = 'center';
                        contactAvatarEl.textContent = '';
                    } else {
                        contactAvatarEl.style.backgroundImage = '';
                        const username = chatObj?.username || 'U';
                        contactAvatarEl.textContent = username.charAt(0).toUpperCase();
                    }
                }
            }
        } catch (e) {
            console.warn('refreshUserAvatar error for', userId, e);
        }
    }

    async function selectChat(el, contactId, contactName) {
        selectedContactId = contactId;
        selectedContactName = contactName;

        document.getElementById('chat-header').classList.remove('hidden');
        document.getElementById('message-input-area').classList.remove('hidden');
        document.getElementById('empty-state').classList.add('hidden');

        const initial = (contactName || 'U').charAt(0).toUpperCase();
        const contactAvatarEl = document.getElementById('contact-avatar');
        // find avatarUrl from chats list if available
        const chatObj = allChats.find(c => parseInt(c.id) === parseInt(contactId));
        if (contactAvatarEl) {
            if (chatObj && chatObj.avatarUrl) {
                contactAvatarEl.style.backgroundImage = `url(${chatObj.avatarUrl})`;
                contactAvatarEl.style.backgroundSize = 'cover';
                contactAvatarEl.style.backgroundPosition = 'center';
                contactAvatarEl.textContent = '';
            } else {
                contactAvatarEl.style.backgroundImage = '';
                contactAvatarEl.textContent = initial;
            }
        }
        document.getElementById('chat-title').textContent = contactName;

        await loadMessages(contactId);

        document.querySelectorAll('.chat-item').forEach(item => {
            item.classList.remove('bg-primary/10', 'dark:bg-primary/10');
        });
        try { if (el && el.classList) el.classList.add('bg-primary/10', 'dark:bg-primary/10'); } catch(_) {}

        if (window.innerWidth < 768) {
            document.querySelector('aside').classList.add('hidden');
        }
    }
    async function loadMessages(contactId) {
    const container = document.getElementById('messages-container');
    container.innerHTML = '<div class="text-center text-gray-500 py-4">⏳ Ładowanie wiadomości...</div>';

    try {
        const inboxRes = await fetchJson('/api/messages/inbox');
        const sentRes = await fetchJson('/api/messages/sent');

        const messages = [];

        // Debug: sprawdź strukturę odpowiedzi
        console.log('📥 Inbox response:', inboxRes.json);
        console.log('📤 Sent response:', sentRes.json);

        if (inboxRes.ok && Array.isArray(inboxRes.json)) {
            inboxRes.json.forEach(msg => {
                // Obsługuj obie możliwe struktury pól
                const senderId = msg.senderId || msg.Sender?.id || msg.Sender?.Id;
                if (senderId === contactId) {
                    messages.push({ ...msg, direction: 'in' });
                }
            });
        }

        if (sentRes.ok && Array.isArray(sentRes.json)) {
            sentRes.json.forEach(msg => {
                // Obsługuj obie możliwe struktury pól
                const recipientId = msg.recipientId || msg.RecipientId;
                if (recipientId === contactId) {
                    messages.push({ ...msg, direction: 'out' });
                }
            });
        }

        messages.sort((a, b) => {
            const dateA = new Date(a.sentAt || a.SentAt || 0);
            const dateB = new Date(b.sentAt || b.SentAt || 0);
            return dateA - dateB;
        });

        console.log(`📊 Filtrowane wiadomości (contactId: ${contactId}):`, messages.length);

        if (messages.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 mt-8">Brak wiadomości z tą osobą. Zacznij rozmowę!</div>';
            return;
        }

        container.innerHTML = messages.map(msg => {
            const isOutgoing = msg.direction === 'out';
            const content = escapeHtml(msg.content || msg.Content || '');
            const dateObj = new Date(msg.sentAt || msg.SentAt || Date.now());
            const timestamp = dateObj.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });

            return `
                <div class="flex ${isOutgoing ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-xs ${isOutgoing ? 'bg-primary text-white' : 'bg-white dark:bg-[#232f48] text-gray-900 dark:text-white'} rounded-lg p-3 shadow-sm break-words">
                        <p class="text-sm">${content}</p>
                        <p class="text-xs mt-1 ${isOutgoing ? 'text-primary-100' : 'text-gray-500 dark:text-gray-400'}">${timestamp}</p>
                    </div>
                </div>
            `;
        }).join('');

        setTimeout(() => {
            container.scrollTop = container.scrollHeight;
        }, 100);

    } catch (error) {
        console.error('❌ Błąd ładowania wiadomości:', error);
        container.innerHTML = '<div class="text-center text-red-500">Błąd ładowania wiadomości</div>';
    }
}
    
    document.getElementById('search-chats').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        
        if (!query) {
            renderChats(allChats);
            return;
        }
        
        const filtered = allChats.filter(c => c.username && c.username.toLowerCase().includes(query));
        
        if (filtered.length === 0) {
            const container = document.getElementById('conversations-list');
            container.innerHTML = '<div class="p-6 text-center text-gray-500 dark:text-gray-400"><p>Brak wyników</p><p class="text-sm mt-2">Spróbuj innego zapytania</p></div>';
        } else {
            renderChats(filtered);
        }
    });

    document.getElementById('new-chat-btn').addEventListener('click', showNewChatModal);

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const input = document.getElementById('message-input');
        const content = input.value.trim();

        if (!content) return;

        const res = await fetchJson('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                recipientUsername: selectedContactName,
                subject: `Wiadomość od ${currentUser.username}`,
                content: content
            })
        });

        if (res.ok) {
            input.value = '';
            await loadChats(); // Odśwież listę konwersacji
            await loadMessages(selectedContactId);
        } else {
            console.error('Błąd wysyłania wiadomości:', res);
            alert('Błąd podczas wysyłania wiadomości: ' + (res.json?.error || res.status));
        }
    });

    document.getElementById('close-chat-mobile')?.addEventListener('click', () => {
        document.querySelector('aside').classList.remove('hidden');
        document.getElementById('chat-header').classList.add('hidden');
        document.getElementById('message-input-area').classList.add('hidden');
        selectedContactId = null;
    });

    document.addEventListener('DOMContentLoaded', async () => {
        const user = await loadCurrentUser();
        if (!user) {
            window.location.href = '/login.html';
            return;
        }

        const authContainer = document.getElementById('auth-container');
        authContainer.innerHTML = `
            <div class="relative flex items-center gap-3">
                <button id="avatar-btn" class="js-avatar-btn w-10 h-10 bg-blue-500 text-white rounded-full hover:ring-2 hover:ring-blue-400/50 font-semibold flex items-center justify-center cursor-pointer" aria-label="Avatar"></button>
                <span id="header-username" class="hidden md:inline font-semibold text-gray-900 dark:text-white">${user.username}</span>
                <div id="avatar-menu" class="js-avatar-menu hidden absolute right-0 top-full mt-2 w-48 bg-white dark:bg-[#192231] rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-2 z-50">
                    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
                        <p class="text-sm font-semibold text-gray-900 dark:text-white">${user.username}</p>
                    </div>
                    <a href="/profile.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#2a3851] transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">person</span>Mój profil
                        </a>
                    <a href="/messages.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#2a3851] transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">mail</span>Wiadomości
                        </a>
                    <hr class="my-1 border-gray-200 dark:border-gray-700">
                    <button id="logout-btn" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">logout</span>Wyloguj się
                        </button>
                </div>
            </div>
        `;

        // Set avatar image if available
        const avatarBtnEl = authContainer.querySelector('.js-avatar-btn, #avatar-btn');
        const avatarMenuEl = authContainer.querySelector('.js-avatar-menu, #avatar-menu');
        if (avatarBtnEl) {
            if (user.avatarUrl) {
                avatarBtnEl.style.backgroundImage = `url(${user.avatarUrl})`;
                avatarBtnEl.style.backgroundSize = 'cover';
                avatarBtnEl.style.backgroundPosition = 'center';
                avatarBtnEl.textContent = '';
            }
            // Direct dropdown handler (forum.html style)
            avatarBtnEl.addEventListener('click', function(e) {
                if (avatarMenuEl) avatarMenuEl.classList.toggle('hidden');
                e.stopPropagation();
            });
            document.addEventListener('click', function(e) {
                if (avatarMenuEl && !avatarBtnEl.contains(e.target) && !avatarMenuEl.contains(e.target)) {
                    avatarMenuEl.classList.add('hidden');
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && avatarMenuEl) {
                    avatarMenuEl.classList.add('hidden');
                }
            });
        }

        // Logout handler
        const logoutBtnEl = document.querySelector('#logout-btn');
        if (logoutBtnEl) {
            logoutBtnEl.addEventListener('click', async () => {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                window.location.href = '/';
            });
        }

        // Logo and Avatar updater
        function initUpdaters() {
            const logoContainer = document.getElementById('logo-container');
            const authContainer = document.getElementById('auth-container');

            async function updateLogo() {
                if (!logoContainer) return;
                try {
                    const response = await fetch('/api/admin/settings/logo');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.logoUrl) {
                            logoContainer.innerHTML = `
                                <div class="flex items-center">
                                    <img src="${data.logoUrl}" alt="Logo" class="h-8 w-auto mr-2">
                                </div>
                                <h1 class="text-xl font-bold text-gray-900 dark:text-white">${data.forumName || 'Forum Dyskusyjne'}</h1>
                            `;
                        }
                    }
                } catch (e) {
                    console.warn('Logo update failed:', e);
                }
            }

            async function updateAvatar() {
                if (!authContainer) return;
                try {
                    const statusResponse = await fetch('/api/auth/status', {
                        method: 'GET',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (statusResponse.ok) {
                        const currentUser = await statusResponse.json();
                        if (currentUser && currentUser.id) {
                            const userResponse = await fetch(`/api/users/${currentUser.id}`, {
                                credentials: 'include'
                            });
                            if (userResponse.ok) {
                                const user = await userResponse.json();
                                const avatarBtn = authContainer.querySelector('.js-avatar-btn, #avatar-btn');
                                if (avatarBtn) {
                                    if (user.avatarUrl) {
                                        avatarBtn.style.backgroundImage = `url(${user.avatarUrl})`;
                                        avatarBtn.style.backgroundSize = 'cover';
                                        avatarBtn.style.backgroundPosition = 'center';
                                        avatarBtn.textContent = '';
                                    } else {
                                        avatarBtn.style.backgroundImage = '';
                                        avatarBtn.textContent = (user.username || 'U').charAt(0).toUpperCase();
                                    }
                                }
                                const headerName = authContainer.querySelector('#header-username');
                                if (headerName && user.username) headerName.textContent = user.username;

                                // ensure central handlers attach to newly inserted elements
                                try { if (typeof ensureAvatarButtons === 'function') ensureAvatarButtons(); } catch(_){}
                                try { if (typeof setupAvatarDelegation === 'function') setupAvatarDelegation(); } catch(_){}
                                try { if (typeof setupAvatarDropdown === 'function') setupAvatarDropdown(); } catch(_){}
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Avatar update failed:', e);
                }
            }

            updateLogo();
            updateAvatar();
            // Refresh every 30 seconds
            setInterval(() => {
                updateLogo();
                updateAvatar();
            }, 30000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initUpdaters);
        } else {
            initUpdaters();
        }

        // Listen for avatar change events from profile page
        window.addEventListener('userAvatarChanged', (event) => {
            console.log('Avatar changed event received for user:', event.detail.userId);
            refreshUserAvatar(event.detail.userId);
        });

        // Also listen for cross-tab updates via localStorage
        window.addEventListener('storage', (event) => {
            if (event.key === 'userAvatarChanged' && event.newValue) {
                try {
                    const data = JSON.parse(event.newValue);
                    console.log('Avatar changed (cross-tab) for user:', data.userId);
                    refreshUserAvatar(data.userId);
                } catch (e) {
                    console.warn('Error parsing storage event:', e);
                }
            }
        });

        await loadChats();
    });
    </script>
</body>
</html>

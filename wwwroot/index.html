<script src="js/main.js"></script>
<script>
async function fetchJson(url, opts = {}) {
    try {
        const res = await fetch(url, Object.assign({ credentials: 'include', headers: { 'Accept': 'application/json' } }, opts));
        if (!res.ok) return { ok: false, status: res.status, json: null };
        const json = await res.json();
        return { ok: true, status: res.status, json };
    } catch (e) {
        console.warn('fetchJson error', url, e);
        return { ok: false, status: 0, json: null };
    }
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
}

// --- OGŁOSZENIA ---
async function loadAnnouncements() {
    const container = document.getElementById('announcements-container');
    if (!container) return;

    try {
        let isAdmin = false;
        try {
            const statusRes = await fetch('/api/auth/status', { credentials: 'include' });
            if (statusRes.ok) {
                const user = await statusRes.json();
                isAdmin = (user.role === 'Admin' || user.role === 'ADMIN');
            }
        } catch (err) {}

        const response = await fetch('/api/announcements/active', {
            headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
            container.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400">Brak ogłoszeń</p>';
            return;
        }

        let announcements = await response.json();

        if (announcements && typeof announcements === 'object' && 'data' in announcements) {
            announcements = announcements.data;
        }

        if (!Array.isArray(announcements) || announcements.length === 0) {
            container.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400">Brak ogłoszeń</p>';
            return;
        }

        container.innerHTML = announcements.map(announcement => `
            <div class="announcement-item bg-gradient-to-r from-blue-500/10 to-purple-500/10 dark:from-blue-900/20 dark:to-purple-900/20 border-l-4 border-blue-500 dark:border-blue-400 p-4 rounded-lg" data-announcement-id="${announcement.id}">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-900 dark:text-white">${escapeHtml(announcement.title)}</h4>
                        <p class="text-sm text-gray-700 dark:text-gray-300 mt-1">${escapeHtml(announcement.content)}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
                            Dodane przez: <strong>${escapeHtml(announcement.createdBy || 'Admin')}</strong>
                        </p>
                    </div>
                    ${isAdmin ? `
                    <button onclick="deleteAnnouncement(this, '${announcement.id}', '${escapeHtml(announcement.title)}')" class="ml-4 text-red-400 hover:text-red-600 dark:hover:text-red-300 flex-shrink-0" title="Usuń ogłoszenie">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                    ` : ''}
                </div>
            </div>
        `).join('');

    } catch (error) {
        console.error('Error loading announcements:', error);
        container.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400">Brak ogłoszeń</p>';
    }
}

async function deleteAnnouncement(btn, announcementId, title) {
    if (!confirm(`Czy na pewno chcesz usunąć ogłoszenie "${title}"?`)) return;

    try {
        const response = await fetch(`/api/announcements/${announcementId}`, {
            method: 'DELETE',
            credentials: 'include'
        });

        if (response.ok) {
            const item = btn.closest('.announcement-item');
            item.style.opacity = '0';
            setTimeout(() => item.remove(), 300);
        } else {
            alert('Nie udało się usunąć ogłoszenia');
        }
    } catch (error) {
        alert('Błąd połączenia');
    }
}

// --- POPULARNE WĄTKI ---
async function loadPopularThreads() {
    const container = document.getElementById('popular-threads');
    if (!container) return;

    container.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 py-4">Ładowanie...</p>';

    let threads = [];
    const tryEndpoints = ['/api/forum/popular?limit=10', '/api/threads?limit=20'];

    for (const url of tryEndpoints) {
        const res = await fetchJson(url);
        if (!res.ok) continue;
        let body = res.json;
        let candidates = [];
        if (Array.isArray(body)) candidates = body;
        else if (body && Array.isArray(body.threads)) candidates = body.threads;
        else if (body && Array.isArray(body.data)) candidates = body.data;
        else if (body && Array.isArray(body.items)) candidates = body.items;

        if (candidates.length > 0) {
            threads = candidates;
            break; 
        }
    }

    if (threads.length === 0) {
        try {
            const catRes = await fetchJson('/api/forum/categories');
            if (catRes.ok && Array.isArray(catRes.json)) {
                const forumIds = [];
                catRes.json.forEach(cat => {
                    (cat.Forums || cat.forums || []).forEach(f => forumIds.push(f.id || f.Id));
                });
                if (forumIds.length > 0) {
                    const promises = forumIds.slice(0, 3).map(fid => 
                        fetchJson(`/api/forum/forum/${fid}`).then(r => (r.ok && r.json) ? (r.json.Threads || r.json.threads || []) : [])
                    );
                    const results = await Promise.all(promises);
                    threads = results.flat();
                }
            }
        } catch (e) {}
    }

    if (!Array.isArray(threads) || threads.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-400">Brak popularnych wątków</p>`;
        return;
    }

    const normalized = threads.map(t => ({
        id: t.id ?? t.Id ?? t.threadId,
        title: t.title ?? t.Title ?? '(brak tytułu)',
        description: t.description ?? t.Description ?? '',
        views: Number(t.views ?? t.Views ?? 0),
        replies: Number(t.repliesCount ?? t.RepliesCount ?? t.messageCount ?? 0),
        forumName: t.forumName ?? (t.Forum ? t.Forum.Name : '') ?? (t.forum ? t.forum.name : '') ?? ''
    })).sort((a, b) => b.views - a.views).slice(0, 2);

    container.innerHTML = normalized.map(thread => `
        <div class="forum-thread p-4 bg-white dark:bg-[#192231] rounded-lg border border-gray-200 dark:border-[#232f48] flex gap-4 items-start hover:shadow-md transition-shadow cursor-pointer" onclick="window.location.href='thread.html?threadId=${thread.id}'">
            <div class="flex-1">
                <h4 class="font-semibold text-lg text-gray-900 dark:text-white">
                    <a href="thread.html?threadId=${encodeURIComponent(thread.id)}" class="hover:underline text-blue-600 dark:text-blue-400">${escapeHtml(thread.title)}</a>
                </h4>
                <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2 mt-1 break-words">${escapeHtml(thread.description)}</p>
                <div class="mt-3 text-xs text-gray-500 dark:text-gray-400 flex items-center gap-3">
                    ${thread.forumName ? `<span class="bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded border border-gray-200 dark:border-gray-700">${escapeHtml(thread.forumName)}</span>` : ''}
                    <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">visibility</span> ${Number(thread.views).toLocaleString('pl-PL')}</span>
                    <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">forum</span> ${Number(thread.replies).toLocaleString('pl-PL')}</span>
                </div>
            </div>
        </div>
    `).join('');
}

// --- STATYSTYKI ---
async function loadStats() {
    try {
        const res = await fetchJson('/api/status');
        if (!res.ok || !res.json) return;
        
        const payload = res.json.stats ? res.json.stats : res.json;
        const setTxt = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = Number(val).toLocaleString('pl-PL'); };

        setTxt('stat-users', payload.totalUsers ?? payload.totalUsersCount ?? 0);
        setTxt('stat-forums', payload.totalForums ?? payload.totalCategories ?? 0);
        setTxt('stat-threads', payload.totalThreads ?? payload.totalThreadsCount ?? 0);
        setTxt('stat-messages', payload.totalMessages ?? payload.totalMessagesCount ?? 0);
    } catch (e) {}
}

// --- INICJALIZACJA ---
document.addEventListener('DOMContentLoaded', async function () {
    // 1. Ładujemy zawartość strony
    loadAnnouncements();
    loadPopularThreads();
    loadStats();

    // 2. UWAGA: Nie obsługujemy tutaj #auth-container ani logowania.
    // Robi to teraz automatycznie plik js/main.js, który dba o poprawny awatar i menu.
});

// Logo (pozostawiamy, bo to specyficzne dla layoutu index.html)
function initUpdatersIndex() {
    const logoContainer = document.getElementById('logo-container');
    if (!logoContainer) return;
    
    async function updateLogo() {
        try {
            const response = await fetch('/api/admin/settings/logo');
            if (response.ok) {
                const data = await response.json();
                if (data.logoUrl) {
                    logoContainer.innerHTML = `
                        <div class="flex items-center">
                            <img src="${data.logoUrl}" alt="Logo" class="h-6 w-auto mr-2">
                        </div>
                        <h1 class="text-xl font-bold text-gray-900 dark:text-white">${data.forumName || 'Forum Dyskusyjne'}</h1>
                    `;
                }
            }
        } catch (e) {}
    }
    updateLogo();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUpdatersIndex);
} else {
    initUpdatersIndex();
}
</script>

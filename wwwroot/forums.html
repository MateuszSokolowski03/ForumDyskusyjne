<!DOCTYPE html>
<html class="dark" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum - Wątki</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation Bar -->
        <header class="sticky top-0 z-50 bg-white/95 dark:bg-[#111722]/95 backdrop-blur-sm border-b border-gray-200 dark:border-[#232f48]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <!-- Logo and Brand -->
                    <div class="flex items-center gap-4">
                        <div id="logo-container" class="flex items-center gap-3">
                            <div class="text-primary">
                                <span class="material-symbols-outlined text-2xl">forum</span>
                            </div>
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white">
                                Forum Dyskusyjne
                            </h1>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <nav class="hidden md:flex items-center gap-6">
                        <a href="/" class="nav-item" title="Strona główna">🏠</a>
                        <a href="forum.html" class="nav-item nav-item--active" title="Kategorie">📂</a>
                        <a href="messages.html" class="nav-item" title="Wiadomości">💬</a>
                        <button id="search-toggle" class="nav-item" title="Szukaj">🔍</button>
                    </nav>

                    <!-- Search and User Actions -->
                    <div class="flex items-center gap-4">
                        <div id="search-container" class="hidden items-center relative">
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 text-sm">search</span>
                                <input 
                                    id="search-input"
                                    type="text" 
                                    placeholder="Szukaj..." 
                                    class="w-40 md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                                >
                                <button id="search-close" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300">
                                    <span class="material-symbols-outlined text-sm">close</span>
                                </button>
                            </div>
                        </div>
                        <div id="auth-container" class="relative"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 id="forum-title" class="text-3xl font-bold text-gray-900 dark:text-white">Ładowanie...</h1>
                        <p id="forum-description" class="text-sm text-gray-500 dark:text-gray-400 mt-2"></p>
                    </div>
                    <button id="new-thread-btn-top" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                        <span class="material-symbols-outlined align-middle">add_circle</span>
                        Nowy wątek
                    </button>
                </div>

                <div id="loading" class="text-center py-8">
                    <p class="text-gray-600 dark:text-gray-400">⏳ Ładowanie wątków...</p>
                </div>

                <div id="content" class="hidden space-y-4"></div>

                <div id="error" class="hidden text-center py-8">
                    <p class="text-red-600 dark:text-red-400">❌ Błąd ładowania wątków</p>
                    <a href="forum.html" class="text-primary hover:underline mt-4 inline-block">← Powrót do kategorii</a>
                </div>
            </div>
        </main>

        <!-- Modal do tworzenia nowego wątku -->
        <div id="new-thread-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-[#192231] rounded-xl shadow-lg max-w-2xl w-full border border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 dark:text-white">Nowy Wątek</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">⚠️ Wątek nie może zawierać zakazanych słów</p>
                        </div>
                    <button id="close-modal" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Tytuł Wątku</label>
                        <input id="thread-title" type="text" placeholder="Wpisz tytuł wątku..." class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Treść</label>
                        <textarea id="thread-content" placeholder="Opisz swoją wiadomość..." rows="6" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#232f48] text-gray-900 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200 dark:border-gray-700">
                    <button id="cancel-modal" class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#232f48] transition-colors">
                        Anuluj
                    </button>
                    <button id="create-thread-btn" class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-primary/90 transition-colors font-medium">
                        Utwórz Wątek
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-auto border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-[#192231]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <p class="text-sm text-gray-500 dark:text-gray-400">© 2024 Forum Dyskusyjne. Wszelkie prawa zastrzeżone.</p>
                    <div class="flex gap-6 text-sm">
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="Regulamin.html">Regulamin</a>
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="Polityka.html">Polityka Prywatności</a>
                        <a class="text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors" href="Kontakt.html">Kontakt</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        let currentUser = null;
        let currentForumId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Inicjalizacja forum...');
            
            const params = new URLSearchParams(window.location.search);
            currentForumId = params.get('forumId');

            if (!currentForumId) {
                console.error('❌ Brak forumId w URL');
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                return;
            }

            try {
                const statusResponse = await fetch('/api/auth/status', { credentials: 'include' });
                
                if (!statusResponse.ok) {
                    console.log('❌ Brak autentykacji');
                    showLoginButtons();
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }
                
                currentUser = await statusResponse.json();
                console.log('✅ Zalogowany:', currentUser.username);
                showUserAvatar(currentUser);
                
                await loadForumThreads(parseInt(currentForumId, 10));
                
            } catch (error) {
                console.error('❌ Błąd:', error);
                showLoginButtons();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }

            setupSearch();
            document.getElementById('new-thread-btn-top').addEventListener('click', openThreadModal);
        });

        async function loadForumThreads(forumId) {
            console.log(`📋 Ładowanie wątków dla forum ${forumId}`);
            try {
                const response = await fetch(`/api/forum/forum/${forumId}`, { credentials: 'include' });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📋 Dane forum:', data);
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                renderForumThreads(data);
                
            } catch (error) {
                console.error('❌ Błąd ładowania:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('content').classList.add('hidden');
            }
        }

        function renderForumThreads(data) {
            const forum = data.forum || data.Forum;
            const threads = (data.threads || data.Threads || []);

            if (!forum) {
                console.error('❌ Brak danych forum');
                document.getElementById('error').classList.remove('hidden');
                return;
            }

            document.getElementById('forum-title').textContent = escapeHtml(forum.name || '');
            document.getElementById('forum-description').textContent = escapeHtml(forum.description || '');

            const content = document.getElementById('content');

            if (!Array.isArray(threads) || threads.length === 0) {
                content.innerHTML = `
                    <div class="text-center py-8 bg-white dark:bg-[#192231] rounded-lg border border-gray-200 dark:border-gray-700">
                        <p class="text-gray-500 dark:text-gray-400">Brak wątków w tym forum</p>
                        <p class="text-sm text-gray-400 mt-2">Bądź pierwszy i utwórz nowy wątek!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            threads.forEach(thread => {
                const threadDate = new Date(thread.createdAt || thread.CreatedAt).toLocaleDateString('pl-PL', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                html += `
                    <a href="thread.html?threadId=${thread.id || thread.Id}" class="block bg-white dark:bg-[#192231] p-6 rounded-lg border border-gray-200 dark:border-gray-700 hover:shadow-md hover:border-primary dark:hover:border-primary transition-all">
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1">
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2 hover:text-primary transition-colors">${escapeHtml(thread.title || thread.Title || '')}</h3>
                                <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">
                                    <span class="font-medium">Autor:</span> ${escapeHtml((thread.author?.username || thread.authorName || thread.Author?.Username || 'Anonimowo'))}
                                </p>
                                <div class="flex flex-wrap gap-6 text-sm">
                                    <span class="text-gray-500 dark:text-gray-400">💬 ${thread.repliesCount || thread.ReplyCount || thread.RepliesCount || 0} odpowiedzi</span>
                                    <span class="text-gray-500 dark:text-gray-400">👁️ ${thread.views || thread.Views || 0} wyświetleń</span>
                                </div>
                            </div>
                            <div class="text-right ml-4">
                                <p class="text-xs text-gray-400">${threadDate}</p>
                            </div>
                        </div>
                    </a>
                `;
            });

            content.innerHTML = html;
        }

        function showLoginButtons() {
            const authContainer = document.getElementById('auth-container');
            authContainer.innerHTML = `
                <div class="flex space-x-4">
                    <a href="/login.html" class="bg-white text-blue-700 px-4 py-2 rounded hover:bg-gray-100 font-medium">
                        Logowanie
                    </a>
                    <a href="/register.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">
                        Rejestracja
                    </a>
                </div>
            `;
        }

        function showUserAvatar(userData) {
            const authContainer = document.getElementById('auth-container');
            const userInitial = userData.username.charAt(0).toUpperCase();
            
            authContainer.innerHTML = `
                <div class="relative flex items-center gap-3">
                    <button id="avatar-btn" class="js-avatar-btn w-10 h-10 bg-blue-500 text-white rounded-full hover:ring-2 hover:ring-blue-400/50 transition-all flex items-center justify-center text-lg cursor-pointer" aria-label="Avatar"></button>
                    <span id="header-username" class="hidden md:inline font-semibold text-gray-900 dark:text-white">${userData.username}</span>

                    <div id="avatar-menu" class="js-avatar-menu hidden absolute right-0 top-full mt-2 w-48 bg-white dark:bg-[#192231] rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-2 z-50">
                        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
                            <p class="text-sm font-semibold text-gray-900 dark:text-white">${userData.username}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">${userData.email || 'Brak e-maila'}</p>
                        </div>

                        <a href="/profile.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#2a3851] transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">person</span>Mój profil
                        </a>

                        <a href="/messages.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#2a3851] transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">mail</span>Wiadomości
                        </a>

                        <hr class="my-1 border-gray-200 dark:border-gray-700">

                        <button id="logout-btn" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <span class="material-symbols-outlined align-middle text-base mr-2">logout</span>Wyloguj się
                        </button>
                    </div>
                </div>
            `;
            
            const logoutBtn = document.querySelector('#logout-btn');
            logoutBtn?.addEventListener('click', async () => {
                try {
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    window.location.href = '/login.html';
                } catch (error) {
                    console.error('❌ Błąd wylogowania:', error);
                }
            });
        }

        function setupSearch() {
            const searchToggle = document.getElementById('search-toggle');
            const searchContainer = document.getElementById('search-container');
            const searchInput = document.getElementById('search-input');
            const searchClose = document.getElementById('search-close');

            if (searchToggle && searchContainer) {
                searchToggle.addEventListener('click', () => {
                    searchContainer.classList.remove('hidden');
                    searchContainer.classList.add('flex');
                    searchInput.focus();
                });

                searchClose.addEventListener('click', () => {
                    searchContainer.classList.add('hidden');
                    searchContainer.classList.remove('flex');
                    searchInput.value = '';
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !searchContainer.classList.contains('hidden')) {
                        searchContainer.classList.add('hidden');
                        searchContainer.classList.remove('flex');
                    }
                });
            }
        }

        function openThreadModal() {
            if (!currentUser) {
                alert('⚠️ Musisz być zalogowany aby utworzyć wątek');
                return;
            }
            document.getElementById('new-thread-modal').classList.remove('hidden');
            document.getElementById('new-thread-modal').classList.add('flex');
            document.getElementById('thread-title').focus();
        }

        function closeThreadModal() {
            document.getElementById('new-thread-modal').classList.add('hidden');
            document.getElementById('new-thread-modal').classList.remove('flex');
            document.getElementById('thread-title').value = '';
            document.getElementById('thread-content').value = '';
        }

        document.getElementById('close-modal').addEventListener('click', closeThreadModal);
        document.getElementById('cancel-modal').addEventListener('click', closeThreadModal);

        document.getElementById('new-thread-modal').addEventListener('click', (e) => {
            if (e.target.id === 'new-thread-modal') closeThreadModal();
        });

        document.getElementById('create-thread-btn').addEventListener('click', async () => {
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();

            if (!title) { alert('⚠️ Wpisz tytuł'); return; }
            if (!content) { alert('⚠️ Wpisz treść'); return; }
            if (title.length < 3) { alert('⚠️ Tytuł musi mieć co najmniej 3 znaki'); return; }
            if (content.length < 10) { alert('⚠️ Treść musi mieć co najmniej 10 znaków'); return; }

            try {
                const response = await fetch('/api/forum/thread', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        forumId: currentForumId
                    })
                });

                if (response.ok) {
                    alert('✅ Wątek został utworzony!');
                    closeThreadModal();
                    location.reload();
                } else {
                    const error = await response.json();
                    const errMsg = error.error || error.message || (error.bannedWords ? ('Wątek zawiera zakazane słowa: ' + (Array.isArray(error.bannedWords) ? error.bannedWords.join(', ') : error.bannedWords)) : 'Nie udało się utworzyć wątku');
                    alert('❌ Błąd: ' + errMsg);
                }
            } catch (error) {
                alert('❌ Błąd: ' + error.message);
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Logo and Avatar updater
        function initUpdaters() {
            const logoContainer = document.getElementById('logo-container');
            const authContainer = document.getElementById('auth-container');

            async function updateLogo() {
                if (!logoContainer) return;
                try {
                    const response = await fetch('/api/admin/settings/logo');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.logoUrl) {
                            logoContainer.innerHTML = `
                                <div class="flex items-center">
                                    <img src="${data.logoUrl}" alt="Logo" class="h-8 w-auto mr-2">
                                </div>
                                <h1 class="text-xl font-bold text-gray-900 dark:text-white">${data.forumName || 'Forum Dyskusyjne'}</h1>
                            `;
                        }
                    }
                } catch (e) {
                    console.warn('Logo update failed:', e);
                }
            }

            async function updateAvatar() {
                if (!authContainer) return;
                try {
                    const statusResponse = await fetch('/api/auth/status', {
                        method: 'GET',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (statusResponse.ok) {
                        const currentUser = await statusResponse.json();
                        if (currentUser && currentUser.id) {
                            const userResponse = await fetch(`/api/users/${currentUser.id}`, {
                                credentials: 'include'
                            });
                            if (userResponse.ok) {
                                const user = await userResponse.json();
                                const avatarBtn = authContainer.querySelector('.js-avatar-btn, #avatar-btn');
                                if (avatarBtn) {
                                    if (user.avatarUrl) {
                                        avatarBtn.style.backgroundImage = `url(${user.avatarUrl})`;
                                        avatarBtn.style.backgroundSize = 'cover';
                                        avatarBtn.style.backgroundPosition = 'center';
                                        avatarBtn.textContent = '';
                                    } else {
                                        avatarBtn.style.backgroundImage = '';
                                        avatarBtn.textContent = (user.username || 'U').charAt(0).toUpperCase();
                                    }
                                }
                                const headerName = authContainer.querySelector('#header-username');
                                if (headerName && user.username) headerName.textContent = user.username;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Avatar update failed:', e);
                }
            }

            updateLogo();
            updateAvatar();
            // Refresh every 30 seconds
            setInterval(() => {
                updateLogo();
                updateAvatar();
            }, 30000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initUpdaters);
        } else {
            initUpdaters();
        }
    </script>
</body>
</html>
